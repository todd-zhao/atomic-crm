# Atomic CRM frontend + assistant reverse proxy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # SPA fallback (hash router, but keep this for direct paths/PWA assets).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assistant sidecar. Keep the /assistant prefix: the service mounts its
    # routes at /assistant/*.
    location /assistant/ {
        proxy_pass http://assistant:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: no buffering, long-lived connection.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
